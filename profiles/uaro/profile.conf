# Profile for uaRO (a Ragnarok Online pre-renewal server). Everything the tools assume about one
# game lives here. The Wine fix itself works for any Ragnarok Online client under CrossOver.
# To support another server, copy this folder to profiles/<name>/, edit it, and run the tools
# with PROFILE=<name> (for example: PROFILE=myserver bash install.sh play).

PROFILE_NAME="uaRO"

# Files in the game folder
GAME_EXE="uaRO.exe"
SETUP_EXE="setup.exe"
PATCHER_EXE="UaRo Patcher.exe"
ICON_FILE="icnbig.ico"               # the game's own icon, used for the launcher icons

# Launcher names shown in CrossOver
LAUNCHER_GAME="UaRO Game"
LAUNCHER_PATCHER="UaRO Patcher"
LAUNCHER_SETUP="UaRO Setup"
LAUNCHER_AZZY="AzzyAI Config"
# name | program (relative to the game folder) | description
LAUNCHERS=(
    "$LAUNCHER_GAME|$GAME_EXE|UaRO game"
    "$LAUNCHER_SETUP|$SETUP_EXE|UaRO graphics and sound setup"
    "$LAUNCHER_AZZY|AI\\USER_AI\\AzzyAiConfigPreRe.exe|AzzyAI settings"
)

# Optional features. Leave empty to turn one off for this profile.
SETUP_PATCH="patch_opensetup_rosetta.py"     # fixes the game's setup.exe under Rosetta (file in this folder)
AZZY_REPO="RagnaJDC/AzzyAI-Pre-Renewal"      # GitHub repository with the AzzyAI release
